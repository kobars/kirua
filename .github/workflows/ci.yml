name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Every gate
    # The platform the system is developed on, so an engine difference shows
    # here rather than only on a contributor's machine. The screenshot
    # comparison is left out on CI (see the visual project in vite.config.ts)
    # and runs in every local `pnpm check`.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install chromium webkit

      # The same six commands as `pnpm check:all`, one step each so a failure
      # names its gate.
      # About 28 minutes on a passing run. A browser that stops answering
      # leaves Vitest waiting with no test timer left to fire, so the step
      # stops itself rather than holding the runner for the whole job.
      - name: Component gate (types, lint, format, every Vitest project, WebKit)
        run: pnpm check
        timeout-minutes: 40

      - name: Hero page build and size budget
        run: pnpm build

      - name: Package tree-shaking and per-component size
        run: pnpm size:components

      - name: Package installed as a consumer installs it
        run: pnpm check:install

      - name: Example app checks
        run: pnpm check:examples

      - name: Storybook build and browser checks
        run: pnpm check:storybook

  lighthouse:
    name: Lighthouse, against the base branch
    # A comparison needs a base, so it runs on pull requests only. It runs on
    # Linux beside the gates and fails only if Lighthouse itself cannot run:
    # slower routes are reported as warnings and in the job summary.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Check out the base branch beside it
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: lighthouse-base

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm install --frozen-lockfile
        working-directory: lighthouse-base

      - run: pnpm exec playwright install --with-deps chromium

      # From source, as the other example checks measure: the base build is
      # the base branch's components, not the last release.
      - name: Build the example app, head and base
        run: |
          KIRUA_SOURCE=1 pnpm build:examples
          cd lighthouse-base && KIRUA_SOURCE=1 pnpm build:examples

      - name: Compare
        run: pnpm lighthouse:compare lighthouse-base/examples/dist examples/dist
        env:
          KIRUA_REVIEW_OUTPUT: lighthouse-reports

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: lighthouse-reports/lighthouse-compare/
          retention-days: 14
