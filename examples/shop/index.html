<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A storefront, cart and checkout built only from the kirua design system." />
    <title>Dusk — a kirua example</title>

    <!-- Same two-origin preconnect as the design system's own page: the font
         files are on gstatic and need `crossorigin`; googleapis serves only the
         small CSS. The host document loads them, never the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..600&family=Luckiest+Guy&family=Nunito:wght@400..800&display=swap"
    />

    <!-- Dark mode applied before first paint, so the page never flashes light.
         Blocking on purpose. -->
    <script>
      (() => {
        const stored = localStorage.getItem('kirua-theme');
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <script>
      // TEMPORARY: the style experiment, applied before first paint too, by
      // the rule examples/shared/styleExperiment.ts follows: a valid value in
      // the link wins, else a valid stored one, else the default. A script of
      // its own, so the theme script above throwing on refused storage cannot
      // stop it.
      (() => {
        const params = new URLSearchParams(location.search);
        const pick = (param, key, ids, fallback) => {
          const fromUrl = params.get(param);
          if (ids.includes(fromUrl)) return fromUrl;
          try {
            const stored = localStorage.getItem(key);
            return ids.includes(stored) ? stored : fallback;
          } catch {
            return fallback;
          }
        };
        const root = document.documentElement;
        const style = pick(
          'style',
          'kirua-style-experiment',
          ['off', 'clay', 'hybrid', 'hybrid-clay'],
          'off',
        );
        if (style !== 'off') root.dataset.styleExperiment = style;
        const night = pick(
          'night',
          'kirua-night-palette',
          ['navy', 'graphite', 'onyx', 'ink', 'carbon'],
          'navy',
        );
        if (night !== 'navy') root.dataset.nightPalette = night;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
