<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The marketing site for Aozora, built only from the kirua design system." />
    <title>Aozora — a kirua example</title>

    <!-- Same two-origin preconnect as the design system's own page: the font
         files are on gstatic and need `crossorigin`; googleapis serves only the
         small CSS. The host document loads them, never the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..600&family=Luckiest+Guy&display=swap"
    />

    <!-- Dark mode applied before first paint, so the page never flashes light.
         Blocking on purpose. -->
    <script>
      (() => {
        const stored = localStorage.getItem('kirua-theme');
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
