<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A shop, a hospital system, a social app, an assistant and a marketing site, built only from the kirua design system."
    />
    <title>Kirua examples</title>

    <!-- The chunks of the section the address names, fetched alongside the
         entry instead of after it has run. It sits above every stylesheet,
         because an inline script after a pending stylesheet waits for it. The
         build fills in the files; as written it names none. -->
    <script>
      (() => {
        const sectionChunks = {};
        const section = (location.hash || '').replace(/^#\/?/, '').split('/')[0];
        const files = Object.hasOwn(sectionChunks, section) ? sectionChunks[section] : [];
        for (const file of files) {
          const link = document.createElement('link');
          link.rel = 'modulepreload';
          link.crossOrigin = '';
          link.href = new URL(file, document.baseURI).href;
          document.head.append(link);
        }
      })();
    </script>

    <!-- Same two-origin preconnect as the design system's own page: the font
         files are on gstatic and need `crossorigin`; googleapis serves only the
         small CSS. The host document loads them, never the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400..800&display=swap"
    />

    <!-- Dark mode applied before first paint, so the page never flashes light.
         Blocking on purpose. -->
    <script>
      (() => {
        // Refused storage means no stored choice, so the system decides.
        let stored = null;
        try {
          stored = localStorage.getItem('kirua-theme');
        } catch {}
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <script>
      // The night palette of dark mode, applied before first paint too, by the
      // rule examples/shared/useNightPalette.ts follows: a valid value in the
      // link wins, else the section's stored choice, else the section's own
      // night (navy on the hub, which sets no attribute). The build fills in
      // each section's night from examples/sections.ts. A script of its own,
      // so nothing the theme script above does can stop it.
      (() => {
        const nights = ['navy', 'graphite', 'onyx', 'ink', 'carbon'];
        const sectionNights = {};
        const section = (location.hash || '').replace(/^#\/?/, '').split('/')[0];
        const own = Object.hasOwn(sectionNights, section);
        const key = own ? `kirua-night-palette:${section}` : 'kirua-night-palette';
        const fallback = own ? sectionNights[section] : 'navy';
        const pick = () => {
          const fromUrl = new URLSearchParams(location.search).get('night');
          if (nights.includes(fromUrl)) return fromUrl;
          try {
            const stored = localStorage.getItem(key);
            return nights.includes(stored) ? stored : fallback;
          } catch {
            return fallback;
          }
        };
        const night = pick();
        if (night !== 'navy') document.documentElement.dataset.nightPalette = night;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
