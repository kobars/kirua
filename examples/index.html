<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A shop, a hospital system, a social app, an assistant and a marketing site, built only from the kirua design system."
    />
    <title>Kirua examples</title>

    <!-- Same two-origin preconnect as the design system's own page: the font
         files are on gstatic and need `crossorigin`; googleapis serves only the
         small CSS. The host document loads them, never the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@400..800&display=swap"
    />

    <!-- Dark mode applied before first paint, so the page never flashes light.
         Blocking on purpose. -->
    <script>
      (() => {
        const stored = localStorage.getItem('kirua-theme');
        const dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
    <script>
      // The night palette of dark mode, applied before first paint too, by the
      // rule examples/shared/useNightPalette.ts follows: a valid value in the
      // link wins, else a valid stored one, else navy, which sets no
      // attribute. A script of its own, so the theme script above throwing on
      // refused storage cannot stop it.
      (() => {
        const nights = ['navy', 'graphite', 'onyx', 'ink', 'carbon'];
        const pick = () => {
          const fromUrl = new URLSearchParams(location.search).get('night');
          if (nights.includes(fromUrl)) return fromUrl;
          try {
            const stored = localStorage.getItem('kirua-night-palette');
            return nights.includes(stored) ? stored : 'navy';
          } catch {
            return 'navy';
          }
        };
        const night = pick();
        if (night !== 'navy') document.documentElement.dataset.nightPalette = night;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
